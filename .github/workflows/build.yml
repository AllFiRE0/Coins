name: Build Coins with Hopper Fix

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Patch HopperHandler.java
      run: |
        find src -name "HopperHandler.java" -exec sed -i 's/if (!coins.getCoinMeta().isDroppedCoin(item)) {/if (coins.getCoinMeta().isCoin(item)) {\n            event.setCancelled(true);\n            return;\n        }\n\n        \/\/ Старый код больше не нужен, но оставим для совместимости\n        if (false) {/g' {} \;

    - name: Build with Maven
      run: mvn clean package --batch-mode

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Coins-patched
        path: target/Coins-*.jar
